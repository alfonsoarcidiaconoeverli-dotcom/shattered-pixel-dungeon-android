windows.wndvictorycongrats.title=Vittoria!
windows.wndvictorycongrats.start_text=Congratulazioni per aver conquistato il dungeon! Hai sbloccato alcune nuove funzionalità disponibili quando scegli un eroe:
windows.wndvictorycongrats.challenges=Ora puoi abilitare le _sfide!_ Questi sono modificatori opzionali per rendere il gioco più difficile in vari modi.
windows.wndvictorycongrats.custom_seeds=Ora puoi inserire _semi personalizzati!_ Lo stesso seme e la stessa versione del gioco producono sempre lo stesso dungeon.
windows.wndvictorycongrats.dailies=Ora puoi partecipare alle _corse giornaliere!_ Ogni giorno c'è una nuova corsa giornaliera uguale per tutti!
windows.wndvictorycongrats.thank_you=Grazie mille per aver giocato a Shadow Dungeon!
windows.wndvictorycongrats.support_prompt=Se non l'hai già fatto, _considera di supportare il gioco._ Il supporto dei giocatori permette allo sviluppatore di continuare a migliorarlo.
windows.wndvictorycongrats.support=Supporto
windows.wndvictorycongrats.close=Chiudi

windows.wndwandmaker.dust=Oh, vedo che hai la polvere! Non preoccuparti per gli spettri, posso occuparmene io. Come promesso, puoi scegliere una delle mie bacchette di alta qualità.
windows.wndwandmaker.ember=Oh, vedo che hai le braci! Spero che l'elementale del fuoco non ti abbia dato troppi problemi. Come promesso, puoi scegliere una delle mie bacchette di alta qualità.
windows.wndwandmaker.berry=Oh, vedo che hai la bacca! Spero che la pianta di rotberry non ti abbia dato troppi problemi. Come promesso, puoi scegliere una delle mie bacchette di alta qualità.
windows.wndwandmaker.farewell=Buona fortuna nella tua missione, %s!
